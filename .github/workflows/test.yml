name: Test

permissions:
  contents: write

on:
  schedule:
    - cron: 0 13 1 * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: jiutv
            repoName: TVBoxOS
            branchName: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          # 用 git ls-remote 直接问远端 main 的真实 HEAD —— 不依赖网页 HTML 缓存！
          commit=$(git ls-remote "$upStream.git" refs/heads/${{ matrix.branchName }} | awk '{print $1; exit}')
          echo "git ls-remote result commit=$commit"
          if [[ -z "${commit}" ]]; then
            commit=$(curl -sL "$upStream/commits/${{ matrix.branchName }}" | grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" | head -1 | cut -d\/ -f5)
            echo "curl fallback commit=$commit"
          fi
          if ! grep -q "$commit" README.md || [ "${{ inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
          fi
          echo "commit=$commit"
      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone --depth 200 "$upStream" TVBoxOSC
          cd TVBoxOSC
          # 强制 fetch main 最新，绕过缓存
          git fetch origin main --depth=200
          # 如果 env.commit 是 HEAD 就直接检出，否则 checkout 指定 SHA
          head_sha=$(git rev-parse origin/main)
          echo "origin/main HEAD=$head_sha env.commit=${{ env.commit }}"
          if [ "${{ env.commit }}" = "$head_sha" ]; then
            git checkout origin/main
          else
            git checkout ${{ env.commit }} || git checkout origin/main
          fi
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV
      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo '修改VersionName'
          if [ "${{ matrix.userName }}" == "takagen99" ]; then
            # 进行 sed 修改
            sed -i 's/\.concat(buildTime())/ +\"${{ env.tag }}\"/g' app/build.gradle 
            # 目前关于页面没有合并我的分支
            sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          else
             sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${{ env.tag }}\'#" app/build.gradle
             sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          fi 
          echo 'crosswalk源，防挂'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          echo '修复Python路径为Linux环境'
          if [ -f pyramid/build.gradle ]; then
            sed -i 's|buildPython("[^"]*")|buildPython("/usr/bin/python3")|' pyramid/build.gradle
          fi
      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          #zip -q -x ".git/*" -x  ".github/*" -r sourceCode-${{ env.commitS }}.zip .
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *
      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties
          sed -i '/^#org.gradle.jvmargs/s/^#//'             ./gradle.properties
      - name: Setup Java 17 (for sdkmanager)
        if: ${{ env.commit }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        if: ${{ env.commit }}
        run: |
          export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;30.0.3" "build-tools;33.0.2"
      - name: Setup Java 11 (for Gradle build)
        if: ${{ env.commit }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.commit }}
      - name: Generate local.properties
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
      - name: Build Environment Info
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "Java version:"
          java -version 2>&1
          echo "Python version:"
          python3 --version 2>&1 || echo "no python3"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "local.properties:"
          cat local.properties
      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          # 逐个 flavor 独立构建，互不影响，确保全部产出
          mkdir -p build_logs
          for flavor in java java32 java64 python python32 python64; do
            echo "===== Building flavor: $flavor ====="
            if ./gradlew "assemble${flavor^}Release" --build-cache --stacktrace --warning-mode all > "build_logs/${flavor}.log" 2>&1; then
              echo "✅ $flavor OK"
            else
              echo "❌ $flavor FAILED (详见 build_logs/${flavor}.log)"
              tail -80 "build_logs/${flavor}.log"
            fi
          done
          echo "===== 全部 flavor 构建结束 ====="
      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          for file in `find ~ -name "*release*.apk" -print`; do
            # 获取文件的基本名称
            base=$(basename "$file")
            # 如果文件是 TVBox_ 开头
            if [[ "$base" == TVBox_* ]]; then
              new_base=$(echo "$base" | sed "s/release/${{ matrix.userName }}_${{ env.tag }}/")
            else
              new_base="TVBox_${{ matrix.userName }}_${{ env.tag }}.apk"
            fi
            # 移动并重命名文件
            mv "$file" "apk/$new_base"
          done
          mv sourceCode-${{ env.commitS }}.* apk/
      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md 2>/dev/null | grep -o '[a-f0-9]\{40\}' || true)
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ -z "$lastCommit" ] || [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 |sed -e "s# \{2,\}#\n#g" -e "/^Merge $pull\|branch\|remote$/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} |sed -e "s# \{2,\}#\n#g" -e "/^Merge $pull\|branch\|remote$/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi
          echo -e '\n```' >> apk/${{ matrix.userName }}-Release.log
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            TVBoxOSC/apk/*
            TVBoxOSC/build_logs/
      - name: Whether Or Not to Publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.donotpublish == true && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV
          echo "⚠️ 已勾选 donotpublish，跳过 Release 发布"
      - name: Prepare APKs for Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.donotpublish == false && env.commit }}
        run: |
          set -e
          echo "=== TVBoxOSC/apk/ 目录内容 ==="
          ls -la TVBoxOSC/apk/
          echo ""
          echo "=== 查找所有 APK ==="
          shopt -s nullglob
          apks=(TVBoxOSC/apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "❌ TVBoxOSC/apk/ 下没有 APK！"
            echo "=== find ~ 搜索 ==="
            find ~ -name "*.apk" 2>/dev/null | head -20
            exit 1
          fi
          echo "找到 ${#apks[@]} 个 APK："
          ls -la "${apks[@]}"
          echo ""
          echo "=== 复制到 repo root ==="
          cp -v "${apks[@]}" ./
          echo ""
          echo "=== repo root 下的 APK ==="
          ls -la ./*.apk
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.donotpublish == false && env.commit }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: TVBoxOS ${{ env.tag }}
          body_path: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          files: ./*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
